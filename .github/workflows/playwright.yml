# To run manually:
# GitHub → Actions → Playwright Tests → Run workflow

name: 🎭 Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven
        default: "test:e2e"

      browser:
        description: "Select browser"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"

      mode:
        description: "Run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"

jobs:
  test:
    timeout-minutes: 60
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install

      - name: ⚙️ Create .env File
        run: cp .env.example .env

      - name: 🧪 Run Playwright Tests
        shell: bash
        run: |
          SUITE="${{ inputs.test_suite || 'test:e2e' }}"
          BROWSER="${{ inputs.browser || 'chromium' }}"
          MODE="${{ inputs.mode || 'headless' }}"

          TAG="${SUITE#test:}"

          MODE_FLAG=()
          if [[ "$MODE" == "headed" ]]; then
            MODE_FLAG=(--headed)
          fi

          npx playwright test \
            --grep "@${TAG}" \
            --project="$BROWSER" \
            "${MODE_FLAG[@]}" \
            --output=test-results
        env:
          CI: "1"

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: 📋 Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-report
          path: custom-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: 📈 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore